name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and UI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller
          python -m pip install -r requirements.txt

      # A real `python -m tkinter` opens a blocking window on CI, so the
      # imports are verified instead.
      - name: Verify GUI imports
        shell: bash
        run: python -c "import tkinter, customtkinter, pygame; print('tkinter', tkinter.TkVersion); print('customtkinter', customtkinter.__version__); print('pygame', pygame.version.ver)"

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows folder app
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onedir --windowed --noupx --collect-all customtkinter --collect-all pygame --name InterstellarDriversEd --version-file packaging/version_info.txt simulator.py

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\InterstellarDriversEd -DestinationPath InterstellarDriversEd-Windows.zip -Force

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --windowed --noupx --collect-all customtkinter --collect-all pygame --name InterstellarDriversEd --osx-bundle-identifier com.rebelaerospace.interstellardriversed simulator.py

      - name: Stamp macOS bundle version
        if: runner.os == 'macOS'
        run: |
          PLIST="dist/InterstellarDriversEd.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.2.1" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.2.1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.2.1" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1.2.1" "$PLIST"

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/InterstellarDriversEd.app" InterstellarDriversEd-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterstellarDriversEd-${{ runner.os }}
          path: InterstellarDriversEd-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach builds to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body: |
            ## The Interstellar Driver's Ed

            Created and developed by [Jaskirat025](https://github.com/Jaskirat025).

            A 3D desktop flight simulator: three SpaceX-inspired missions, a five-ship hangar, procedural audio and a software 3D engine.

            ### Download
            - **Windows x64:** `InterstellarDriversEd-Windows.zip` — extract the whole folder and run `InterstellarDriversEd.exe`
            - **macOS Apple Silicon:** `InterstellarDriversEd-macOS.zip` — extract and open `InterstellarDriversEd.app`

            These builds are not code-signed yet. On first launch, Windows SmartScreen may ask for **More info → Run anyway**; on macOS, right-click the app and choose **Open**. No account or network is required.

            See the [README](https://github.com/Jaskirat025/interstellar-drivers-ed#readme) for the demo, controls and source instructions.
