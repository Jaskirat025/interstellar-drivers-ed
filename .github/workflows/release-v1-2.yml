name: Build v1.2.0 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Check out the v1.2.0 tag
        uses: actions/checkout@v4
        with:
          ref: v1.2.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and UI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller
          python -m pip install -r requirements.txt

      - name: Verify GUI imports
        shell: bash
        run: python -c "import tkinter, customtkinter, pygame; print('tkinter', tkinter.TkVersion); print('customtkinter', customtkinter.__version__); print('pygame', pygame.version.ver)"

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows folder app
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onedir --windowed --noupx --collect-all customtkinter --collect-all pygame --name InterstellarDriversEd --version-file packaging/version_info.txt simulator.py

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\InterstellarDriversEd -DestinationPath InterstellarDriversEd-Windows.zip -Force

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --windowed --noupx --collect-all customtkinter --collect-all pygame --name InterstellarDriversEd --osx-bundle-identifier com.rebelaerospace.interstellardriversed simulator.py

      - name: Stamp macOS bundle version
        if: runner.os == 'macOS'
        run: |
          PLIST="dist/InterstellarDriversEd.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.2.0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.2.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.2.0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1.2.0" "$PLIST"

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/InterstellarDriversEd.app" InterstellarDriversEd-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterstellarDriversEd-${{ runner.os }}
          path: InterstellarDriversEd-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach v1.2.0 builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the existing v1.2.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          files: artifacts/*.zip
          generate_release_notes: true
